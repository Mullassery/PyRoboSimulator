---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: pyrobosim

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyrobosim-config
  namespace: pyrobosim
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  DATABASE_POOL_MIN_SIZE: "5"
  DATABASE_POOL_MAX_SIZE: "20"
  CORS_ORIGINS: '["https://app.example.com"]'
  MAX_AGENTS: "1000000"
  DEFAULT_TIMESTEP: "0.016"
  PROMETHEUS_PORT: "8001"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: pyrobosim-secrets
  namespace: pyrobosim
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://user:password@postgres:5432/pyrobosim_prod"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "your-super-secret-key-change-in-production"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyrobosim-backend
  namespace: pyrobosim
  labels:
    app: pyrobosim-backend
    version: v0.1.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pyrobosim-backend
  template:
    metadata:
      labels:
        app: pyrobosim-backend
    spec:
      # Pod anti-affinity to spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - pyrobosim-backend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: backend
          image: gcr.io/your-project/pyrobosim:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
            - containerPort: 8001
              name: metrics
              protocol: TCP

          # Environment variables from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: pyrobosim-config
            - secretRef:
                name: pyrobosim-secrets

          # Resource requests and limits
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # Startup probe (give app 30 seconds to start)
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            failureThreshold: 30
            periodSeconds: 1

          # Liveness probe (restart if unhealthy)
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe (remove from service if not ready)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache

      # Volumes
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      # Service account
      serviceAccountName: pyrobosim

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: pyrobosim-backend
  namespace: pyrobosim
  labels:
    app: pyrobosim-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: metrics
  selector:
    app: pyrobosim-backend

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pyrobosim-backend-hpa
  namespace: pyrobosim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pyrobosim-backend
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pyrobosim-backend-pdb
  namespace: pyrobosim
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: pyrobosim-backend

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyrobosim
  namespace: pyrobosim

---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyrobosim-backend
  namespace: pyrobosim
spec:
  podSelector:
    matchLabels:
      app: pyrobosim-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 443   # HTTPS
        - protocol: TCP
          port: 53    # DNS
        - protocol: UDP
          port: 53    # DNS
