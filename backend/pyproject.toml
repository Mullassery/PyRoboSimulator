[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrobosimulator"
version = "0.4.0"
description = "AI-native world simulation platform for robots and autonomous systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PyRoboSimulator Team"}]

dependencies = [
    # Web Framework
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",

    # Database
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "alembic==1.12.1",

    # Caching
    "redis==5.0.1",

    # WebSocket & Real-time
    "websockets==12.0",
    "msgpack==1.0.7",

    # Validation & Serialization
    "python-multipart==0.0.6",

    # Authentication
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.0",

    # Logging & Monitoring
    "prometheus-client==0.19.0",
    "python-json-logger==2.0.7",

    # Utilities
    "numpy==1.24.3",
    "scipy==1.11.4",
    "pillow==10.1.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-benchmark==4.0.0",
    "pytest-mock==3.12.0",
    "httpx==0.25.2",

    # Code Quality
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==6.1.0",
    "pylint==3.0.3",
    "mypy==1.7.1",
    "bandit==1.7.5",
    "safety==2.3.5",

    # Pre-commit
    "pre-commit==3.5.0",

    # Documentation
    "mkdocs==1.5.3",
    "mkdocs-material==9.4.14",
]

[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
    /(
        \.git
        | \.venv
        | build
        | dist
    )/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pylint.messages_control]
disable = [
    "too-many-arguments",
    "duplicate-code",
    "too-few-public-methods",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/site-packages/*",
    "*/distutils/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
