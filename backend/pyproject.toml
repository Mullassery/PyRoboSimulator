[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrobosimulator"
version = "0.10.0"
description = "AI-native world simulation platform for robots and autonomous systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "PyRoboSimulator Team"}]

dependencies = [
    # Web Framework
    # Floated (was ==0.104.1) -- that pin dragged in a starlette with a
    # known CVE that `safety check` flags; no upper bound needed since
    # nothing else in this list constrains fastapi's own major version.
    "fastapi>=0.115.0",
    "uvicorn[standard]==0.24.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings==2.1.0",

    # Database
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "alembic==1.12.1",
    "greenlet==3.5.5",

    # Caching
    "redis==5.0.1",

    # WebSocket & Real-time
    "websockets==16.1.1",
    "msgpack>=1.0.8",

    # Validation & Serialization
    "python-multipart>=0.0.18",
    "email-validator==2.3.0",

    # Authentication
    # Floated (was ==3.3.0) -- pinned version has a known DoS CVE
    # (CVE-2024-33664) fixed upstream; no fixed release exists yet as of
    # this writing so this floats to pick up a fix once one ships.
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]==1.7.4",
    # passlib 1.7.4 (unmaintained) self-tests bcrypt at import time using an
    # input that bcrypt>=4.1 rejects with ValueError instead of the silent
    # truncation older bcrypt did - breaks all password hashing/verification.
    # Pin to the last compatible release until passlib is replaced/fixed.
    "bcrypt<4.1",
    "python-dotenv>=1.0.1",

    # Logging & Monitoring
    "prometheus-client==0.19.0",
    "python-json-logger==2.0.7",

    # Utilities
    "numpy==1.24.3",
    "scipy==1.11.4",
    "pillow>=10.3.0",

    # Narrative Engine (NLP -> scenario conversion)
    "anthropic==0.122.0",
]

[project.optional-dependencies]
dev = [
    # `[build-system] requires` only pins the isolated build-backend env,
    # not the environment `pip install -e ".[dev]"` leaves installed --
    # safety scans the latter, so the setuptools floor needs to be listed
    # here too or CI keeps resolving whatever setuptools ships preinstalled
    # on the runner (which was the still-vulnerable 79.0.1).
    "setuptools>=83.0.0",

    # Testing
    # Upper-bounded: pytest-asyncio==0.21.1 (below) reaches into pytest's
    # private FixtureDef internals (`fixturedef.unittest`), which pytest 8
    # removed. An unbounded floor here silently resolves pytest 8/9 on any
    # fresh install and breaks every async-fixture-based test (auth,
    # simulations API, health checks) with
    # "AttributeError: 'FixtureDef' object has no attribute 'unittest'".
    # Verified: 33 errors with pytest 9.1.1 and with pytest 8.4.2, 0 with
    # pytest==7.4.4. Bumping pytest-asyncio instead (rather than pinning
    # pytest) was not attempted here -- 0.21.1 predates pytest-asyncio's
    # strict/auto mode config rework, so upgrading it is a separate,
    # untested behavior change, not a same-day pin fix.
    "pytest>=7.4.4,<8",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-benchmark==4.0.0",
    "pytest-mock==3.12.0",
    "httpx==0.25.2",
    "aiosqlite==0.19.0",

    # Code Quality
    "black>=26.3.1",
    "isort==5.13.2",
    "flake8==6.1.0",
    "pylint==3.0.3",
    "mypy==1.7.1",
    "bandit>=1.7.8",
    # bandit imports pbr.version at runtime but doesn't declare it in its own
    # install_requires (only setup_requires) - without this, `bandit` fails
    # with "ModuleNotFoundError: No module named 'pbr'" on a clean install.
    "pbr>=5.0.0",
    "safety>=3.7.0",

    # Pre-commit
    "pre-commit==3.5.0",

    # Documentation
    "mkdocs~=1.6",
    "mkdocs-material>=9.5.32",

    # Physics backend tests (MuJoCo)
    "mujoco>=3.5.0",
]

# MuJoCo physics backend. Real, pip-installable, no GPU/ROS2/Omniverse
# required. See src/simulators/mujoco_backend.py.
physics = [
    "mujoco>=3.5.0",
]

# CLI analytics dashboard (Textual TUI). Optional: src/analytics/__init__.py
# degrades gracefully to plain MetricsCollector-only usage without it.
dashboard = [
    "textual>=0.47.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
    /(
        \.git
        | \.venv
        | build
        | dist
    )/
'''

[tool.isort]
profile = "black"
line_length = 100
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pylint.messages_control]
disable = [
    "too-many-arguments",
    "duplicate-code",
    "too-few-public-methods",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/site-packages/*",
    "*/distutils/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
