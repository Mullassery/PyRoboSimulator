version: 2
updates:
  # Root Rust workspace (pyrobosimulator-core PyO3 extension)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # Root pip package (maturin-built pyrobosimulator wheel)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # FastAPI backend service
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # React/Vite frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
