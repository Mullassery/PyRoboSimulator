name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/ci-cd.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'

env:
  REGISTRY: gcr.io
  IMAGE_NAME: pyrobosim

jobs:
  # Quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"

      - name: Format check (black)
        working-directory: backend
        run: black --check src/ tests/

      - name: Import sort check (isort)
        working-directory: backend
        run: isort --check-only src/ tests/

      - name: Lint (flake8)
        working-directory: backend
        run: flake8 src/ tests/ --max-line-length=100

      - name: Type check (mypy)
        working-directory: backend
        run: mypy src/

      - name: Security scan (bandit)
        working-directory: backend
        run: bandit -r src/ -ll

      - name: Dependency check (safety)
        working-directory: backend
        run: safety check

  # Unit and integration tests
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        env:
          # Must use the asyncpg driver scheme: src/db/session.py passes this
          # straight into SQLAlchemy's create_async_engine(), which needs an
          # async-capable DBAPI. A plain postgresql:// URL makes SQLAlchemy
          # fall back to psycopg2 (sync-only, and not even a declared
          # dependency), breaking every test that imports src.main (and thus
          # every test using the `client` fixture) with
          # "ModuleNotFoundError: No module named 'psycopg2'".
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70

  # Build Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Get commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            gcr.io/${{ secrets.GCP_PROJECT }}/pyrobosim:latest
            gcr.io/${{ secrets.GCP_PROJECT }}/pyrobosim:${{ steps.vars.outputs.sha_short }}
            gcr.io/${{ secrets.GCP_PROJECT }}/pyrobosim:v0.1.0
          cache-from: type=registry,ref=gcr.io/${{ secrets.GCP_PROJECT }}/pyrobosim:buildcache
          cache-to: type=registry,ref=gcr.io/${{ secrets.GCP_PROJECT }}/pyrobosim:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # Scan Docker image for vulnerabilities
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gcr.io/${{ secrets.GCP_PROJECT }}/pyrobosim:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Get GKE cluster credentials
        run: |
          gcloud container clusters get-credentials staging-cluster \
            --zone us-central1-a \
            --project ${{ secrets.GCP_PROJECT }}

      - name: Deploy with kubectl
        working-directory: backend
        run: |
          kubectl set image deployment/pyrobosim-backend \
            -n pyrobosim \
            backend=gcr.io/${{ secrets.GCP_PROJECT }}/pyrobosim:latest \
            --record

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/pyrobosim-backend \
            -n pyrobosim \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n pyrobosim -l app=pyrobosim-backend

  # Post deployment checks
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Wait for service
        run: |
          sleep 30
          for i in {1..30}; do
            if curl -f https://api-staging.example.com/health; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

      - name: Run smoke tests
        run: |
          curl -X POST https://api-staging.example.com/api/v1/simulations \
            -H "Content-Type: application/json" \
            -d '{"name": "smoke-test", "num_agents": 100, "duration": 10}'

  # Notify on failure
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    if: failure()
    needs:
      - quality
      - test
      - build
      - scan
      - deploy-staging
      - smoke-test

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ PyRoboSimulator CI/CD Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Repository: ${{ github.repository }}\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
