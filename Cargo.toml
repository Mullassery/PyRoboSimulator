[workspace]
members = ["pyrobosimulator-core"]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2021"
authors = ["Georgi Mullassery <mullassery@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Mullassery/pyrobosimulator"

[package]
name = "pyrobosimulator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AI-native world simulation engine"
repository.workspace = true

[lib]
name = "pyrobosimulator_core"
crate-type = ["cdylib"]
path = "pyrobosimulator-core/src/lib.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
rocksdb = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
