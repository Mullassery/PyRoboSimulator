[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrobosimulator"
version = "0.2.0"
description = "AI-native world simulation engine: narratives, robotics, agents, ROS 2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Georgi Mullassery", email = "mullassery@gmail.com"}]
keywords = ["robotics", "simulation", "ros2", "agents", "narrative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "pyterrainmap>=1.0.0",
    "pyroboreplay>=2.0.0",
    "pyroboframes>=1.2.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "anthropic>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "httpx>=0.25.0"]
ros2 = ["rclpy>=0.17.0"]

[project.scripts]
pyrobosimulator = "pyrobosimulator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrobosimulator*"]
exclude = ["backend*", "frontend*", "pyrobosimulator-core*", "python*", "scripts*"]
