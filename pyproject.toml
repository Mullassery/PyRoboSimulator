[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyrobosimulator"
version = "0.8.0"
description = "AI-native world simulation engine: narratives, robotics, agents, ROS 2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Georgi Mullassery", email = "mullassery@gmail.com"}]
keywords = ["robotics", "simulation", "ros2", "agents", "narrative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.maturin]
module-name = "pyrobosimulator._core"
