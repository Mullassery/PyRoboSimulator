[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyrobosimulator"
version = "0.11.0"
description = "AI-native world simulation engine: narratives, robotics, agents, ROS 2"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Georgi Mullassery", email = "mullassery@gmail.com"}]
keywords = ["robotics", "simulation", "ros2", "agents", "narrative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
pyrobosimulator = "pyrobosimulator.cli:main"

[tool.maturin]
module-name = "pyrobosimulator._core"
# Without this, maturin falls back to an implicit-namespace-package
# `pyrobosimulator/` at the repo root (which has no __init__.py), silently
# shipping a wheel where `import pyrobosimulator; pyrobosimulator.World`
# does not exist. The real package -- the one with __init__.py wiring up
# World/Agent/Mission/NarrativeEngine/ROS2Bridge from the compiled
# extension -- lives in python/pyrobosimulator/. Verified by unzipping the
# previously-published 0.8.0 wheel on PyPI: it has the same bug (no
# __init__.py), so `pip install pyrobosimulator` has never actually
# exposed the documented API until this fix.
python-source = "python"
